[package]
name = "surreal-rust-tauri-reproducers"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
surrealdb = { version = "=3.2.4", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
# The SDK depends on surrealdb-core / -types / -types-derive through caret ranges, so a fresh
# resolution (no lockfile) pulls 3.3.x under a "3.2.4" label. Pin them, and keep Cargo.lock.
surrealdb-core = { version = "=3.2.4", default-features = false }
surrealdb-types = "=3.2.4"
surrealdb-types-derive = "=3.2.4"
# surrealdb-core reaches collections and strand through caret ranges as well (found 2026-10-08).
surrealdb-collections = "=3.2.4"
surrealdb-strand = "=3.2.4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
