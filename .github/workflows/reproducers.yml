name: Capability Reproducers

on:
  push:
    branches: [main]
    paths:
      - "reproducers/**"
      - ".github/workflows/reproducers.yml"
  pull_request:
    paths:
      - "reproducers/**"
      - ".github/workflows/reproducers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surrealdb-3-2-4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Run SurrealDB 3.2.4 reproducers
        run: cargo test --manifest-path reproducers/surrealdb-3.2.4/Cargo.toml --all-targets
